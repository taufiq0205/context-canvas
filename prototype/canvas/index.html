<!doctype html>
<!-- THROWAWAY UI PROTOTYPE for Issue #6. Branch-only evidence; never production code. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Context Canvas — Throwaway Prototype</title>
  <style>
    :root{font:15px/1.45 system-ui,sans-serif;color:#18202b;background:#f4f5f7;--blue:#2557d6;--line:#c8ced8;--warn:#9c3f0b}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid #ffb000;outline-offset:2px}.top{height:64px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#172033;color:white}.top h1{font-size:18px;margin:0}.tag{background:#ffe3a3;color:#482f00;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:700}.top input{margin-left:auto;width:250px;padding:8px;border-radius:6px;border:0}.toolbar{display:flex;gap:6px}.toolbar button,.actions button{border:1px solid var(--line);background:white;border-radius:6px;padding:7px 10px}.app{height:calc(100vh - 64px);display:grid}.canvas{position:relative;overflow:hidden;background-color:#eef0f4;background-image:radial-gradient(#c9ced8 1px,transparent 1px);background-size:22px 22px;touch-action:none}.world{position:absolute;transform-origin:0 0;width:1100px;height:650px}.node{position:absolute;width:190px;min-height:86px;padding:12px;border:2px solid #7e899b;border-radius:9px;background:white;box-shadow:0 3px 10px #0002;user-select:none}.node strong{display:block}.node small{color:#596477}.node.selected{border-color:var(--blue);box-shadow:0 0 0 3px #2557d633}.badge{display:inline-block;margin-top:7px;padding:2px 6px;border-radius:10px;background:#fde3d4;color:var(--warn);font-size:11px;font-weight:700}.badge.transitive{background:#fff1b8;color:#705200}.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.edge-hit{pointer-events:stroke;cursor:pointer;stroke:transparent;stroke-width:18}.edge{stroke:#657086;stroke-width:3;fill:none;marker-end:url(#arrow)}.edge.selected{stroke:var(--blue);stroke-width:5}.panel{overflow:auto;background:white;border-left:1px solid var(--line);padding:18px}.panel h2,.panel h3{margin:0 0 10px}.panel section{border-bottom:1px solid #ddd;padding:0 0 16px;margin-bottom:16px}.panel label{display:block;margin:7px 0}.panel textarea{width:100%;min-height:220px;font:12px/1.45 ui-monospace,monospace}.actions{display:flex;gap:7px;flex-wrap:wrap}.primary{background:var(--blue)!important;color:white;border-color:var(--blue)!important}.danger{color:#9d1d1d}.checklist{margin:0;padding-left:22px}.state{white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;background:#111827;color:#d8e2f0;padding:10px;border-radius:6px}.switcher{position:fixed;z-index:20;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;background:#111827;color:white;border-radius:999px;box-shadow:0 5px 20px #0006}.switcher button{width:38px;height:34px;border:1px solid #64748b;background:#253149;color:white;border-radius:20px}.switcher output{min-width:190px;text-align:center;font-weight:700}.toast{position:fixed;right:18px;top:78px;background:#172033;color:white;padding:10px 14px;border-radius:6px;z-index:30}.hidden{display:none!important}
    .variant-a{grid-template-columns:minmax(620px,1fr) 380px}.variant-b{grid-template-columns:280px minmax(480px,1fr) 360px}.variant-b .sources{padding:16px;background:#e9edf4;overflow:auto}.source-card{background:white;border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:10px}.source-card.selected{border:2px solid var(--blue)}.variant-b .canvas{border-left:1px solid var(--line)}.variant-c{grid-template-columns:440px minmax(620px,1fr)}.variant-c .preview-first{background:#172033;color:white;padding:20px;overflow:auto}.variant-c textarea{width:100%;height:55vh;background:#0c1321;color:#e7edf7;border:1px solid #526078;padding:12px;font:12px/1.5 ui-monospace,monospace}.variant-c .graph-nav{display:grid;grid-template-rows:1fr 240px}.variant-c .panel{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:16px}.variant-c .panel section{border:0}.empty{color:#657086;font-style:italic}@media(max-width:900px){body:before{content:'Desktop prototype — use a wider window';position:fixed;z-index:99;inset:0;background:#172033;color:white;display:grid;place-items:center;font-size:20px}.switcher{display:none}}
  </style>
</head>
<body>
  <header class="top"><h1>Context Canvas</h1><span class="tag">THROWAWAY PROTOTYPE</span><div class="toolbar"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="add">Add task</button></div><label for="search" class="hidden">Search task titles</label><input id="search" type="search" placeholder="Search task titles…"></header>
  <main id="app" class="app"></main>
  <nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><output id="variantLabel"></output><button id="next" aria-label="Next variant">→</button></nav>
  <div id="toast" class="toast hidden" role="status"></div>
<script>
// THROWAWAY: deliberately dependency-free, in-memory, and unsuitable for production.
const variants={A:'Canvas + inspector',B:'Source workspace',C:'Handoff first'};
const initialNodes=[
 {id:'research',title:'Research authentication',x:70,y:170,run:'run-01',artifact:'auth-findings.md',version:'v2',content:'Prefer secure, server-managed sessions. Avoid storing bearer tokens in browser storage.',status:'changed'},
 {id:'implement',title:'Implement login',x:390,y:170,run:'run-02',artifact:'login-plan.md',version:'v1',content:'Implement login from the selected authentication findings.',status:'outdated'},
 {id:'test',title:'Test login',x:710,y:170,run:'run-03',artifact:'login-tests.md',version:'v1',content:'Test success, failure, expiry, and logout behavior.',status:'potential'}
];
const state={nodes:structuredClone(initialNodes),edges:[{id:'e1',from:'research',to:'implement',selected:true},{id:'e2',from:'implement',to:'test',selected:true}],selectedNode:'implement',selectedEdge:'e1',zoom:1,pan:{x:0,y:0},changeSimulated:false,lastExport:null};
const app=document.querySelector('#app'), search=document.querySelector('#search');
const node=id=>state.nodes.find(n=>n.id===id), edge=id=>state.edges.find(e=>e.id===id);
function variant(){const v=new URLSearchParams(location.search).get('variant')?.toUpperCase();return variants[v]?v:'A'}
function incoming(){return state.edges.filter(e=>e.to===state.selectedNode)}
function included(){return incoming().filter(e=>e.selected).map(e=>node(e.from))}
function handoff(){const target=node(state.selectedNode);return `# Handoff: ${target.title}\n\n## Destination instructions\n${target.content}\n\n## Selected non-authoritative context\n${included().map((n,i)=>`### ${i+1}. ${n.title}\nSource: ${n.title} | Run: ${n.run} | Artifact: ${n.artifact} | Version: ${n.version}\n\n${n.content}`).join('\n\n')||'_No context selected._'}\n`}
function statusBadge(n){return n.status==='changed'?'<span class="badge">upstream context changed</span>':n.status==='potential'?'<span class="badge transitive">potentially outdated</span>':''}
function canvas(){return `<div class="canvas" id="canvas" aria-label="Task context graph"><div class="world" id="world"><svg class="edges" width="1100" height="650" aria-label="Directed context edges"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#657086"/></marker></defs>${state.edges.map(e=>{const a=node(e.from),b=node(e.to),d=`M${a.x+190},${a.y+43} C${a.x+240},${a.y+43} ${b.x-50},${b.y+43} ${b.x},${b.y+43}`;return `<path class="edge-hit" data-edge="${e.id}" d="${d}"/><path class="edge ${state.selectedEdge===e.id?'selected':''}" d="${d}"/>`}).join('')}</svg>${state.nodes.map(n=>`<article class="node ${state.selectedNode===n.id?'selected':''}" tabindex="0" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><strong>${n.title}</strong><small>${n.run} · ${n.artifact} · ${n.version}</small>${statusBadge(n)}</article>`).join('')}</div></div>`}
function inspector(){const e=edge(state.selectedEdge),source=e&&node(e.from),target=e&&node(e.to);return `<aside class="panel"><section><h2>Selection inspector</h2>${e?`<p><strong>${source.title} → ${target.title}</strong></p><label><input id="include" type="checkbox" ${e.selected?'checked':''}> Include exact artifact in future handoffs</label><p>Source: ${source.title}<br>Run: ${source.run}<br>Artifact: ${source.artifact}<br>Version: ${source.version}</p>`:'<p class="empty">Select a directed edge.</p>'}<div class="actions"><button id="simulate">Simulate upstream change</button><button id="refresh">Refresh selection</button><button id="revoke" class="danger">Revoke edge</button></div></section><section><h3>Exact deterministic preview</h3><textarea readonly aria-label="Exact Markdown handoff preview">${escapeHtml(handoff())}</textarea><div class="actions"><button id="export" class="primary">Export Markdown</button></div></section><section><h3>Five-task check</h3><ol class="checklist"><li>Predict included context</li><li>Locate its source</li><li>Update selection</li><li>Interpret freshness</li><li>Revoke or export</li></ol></section><details><summary>Complete in-memory state</summary><pre class="state">${escapeHtml(JSON.stringify(state,null,2))}</pre></details></aside>`}
function sourceWorkspace(){return `<aside class="sources"><h2>${node(state.selectedNode).title}</h2><p>Incoming sources are the primary workspace.</p>${incoming().map(e=>{const n=node(e.from);return `<button class="source-card ${e.id===state.selectedEdge?'selected':''}" data-edge="${e.id}"><strong>${n.title}</strong><br><small>${n.run} · ${n.artifact} · ${n.version}</small><br>${e.selected?'Included':'Excluded'} ${statusBadge(n)}</button>`}).join('')||'<p class="empty">No incoming sources.</p>'}</aside>`}
function previewFirst(){return `<aside class="preview-first"><h2>Exact handoff first</h2><p>Review the deliverable; use the graph to trace or change sources.</p><textarea readonly aria-label="Exact Markdown handoff preview">${escapeHtml(handoff())}</textarea><div class="actions"><button id="export" class="primary">Export Markdown</button></div></aside>`}
function render(){const v=variant();document.querySelector('#variantLabel').textContent=`${v} (${variants[v]})`;history.replaceState(null,'',`?variant=${v}`);if(v==='A'){app.className='app variant-a';app.innerHTML=canvas()+inspector()}else if(v==='B'){app.className='app variant-b';app.innerHTML=sourceWorkspace()+canvas()+inspector()}else{app.className='app variant-c';app.innerHTML=previewFirst()+`<div class="graph-nav">${canvas()}${inspector()}</div>`}bind();transform()}
function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function transform(){const w=document.querySelector('#world');if(w)w.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`}
function bind(){document.querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>{state.selectedNode=el.dataset.node;const e=incoming()[0];state.selectedEdge=e?.id||null;render()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};dragNode(el)});document.querySelectorAll('[data-edge]').forEach(el=>el.onclick=e=>{e.stopPropagation();state.selectedEdge=el.dataset.edge;state.selectedNode=edge(el.dataset.edge).to;render()});const include=document.querySelector('#include');if(include)include.onchange=()=>{edge(state.selectedEdge).selected=include.checked;render()};on('#simulate',()=>{node('research').version='v3';node('implement').status='changed';node('test').status='potential';state.changeSimulated=true;render();toast('Direct and transitive freshness badges updated')});on('#refresh',()=>{const e=edge(state.selectedEdge);if(!e)return;e.selected=true;node(e.to).status='';if(e.to==='implement')node('test').status='';render();toast('Selection refreshed for the next handoff')});on('#revoke',()=>{if(!state.selectedEdge)return;state.edges=state.edges.filter(e=>e.id!==state.selectedEdge);state.selectedEdge=null;render();toast('Edge revoked; historical runs remain')});on('#export',exportMarkdown);panCanvas()}
function on(selector,fn){const el=document.querySelector(selector);if(el)el.onclick=fn}
function dragNode(el){let start;el.onpointerdown=e=>{if(e.button)return;const n=node(el.dataset.node);start={x:e.clientX,y:e.clientY,nx:n.x,ny:n.y};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!start)return;const n=node(el.dataset.node);n.x=start.nx+(e.clientX-start.x)/state.zoom;n.y=start.ny+(e.clientY-start.y)/state.zoom;el.style.left=`${n.x}px`;el.style.top=`${n.y}px`};el.onpointerup=()=>{if(start){start=null;render()}}}
function panCanvas(){const c=document.querySelector('#canvas');let start;c.onpointerdown=e=>{if(e.target!==c)return;start={x:e.clientX,y:e.clientY,px:state.pan.x,py:state.pan.y};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(start){state.pan.x=start.px+e.clientX-start.x;state.pan.y=start.py+e.clientY-start.y;transform()}};c.onpointerup=()=>start=null;c.onwheel=e=>{e.preventDefault();state.zoom=Math.max(.45,Math.min(1.8,state.zoom-e.deltaY*.001));transform()}}
function exportMarkdown(){const blob=new Blob([handoff()],{type:'text/markdown'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.selectedNode}-handoff.md`;a.click();URL.revokeObjectURL(a.href);state.lastExport=new Date().toISOString();render();toast('Markdown handoff exported')}
function toast(message){const t=document.querySelector('#toast');t.textContent=message;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function switchVariant(step){const keys=Object.keys(variants),i=keys.indexOf(variant()),v=keys[(i+step+keys.length)%keys.length];history.pushState(null,'',`?variant=${v}`);render()}
document.querySelector('#previous').onclick=()=>switchVariant(-1);document.querySelector('#next').onclick=()=>switchVariant(1);addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.matches('input,textarea,[contenteditable]'))return;switchVariant(e.key==='ArrowRight'?1:-1)});addEventListener('popstate',render);
document.querySelector('#zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.15);transform()};document.querySelector('#zoomOut').onclick=()=>{state.zoom=Math.max(.45,state.zoom-.15);transform()};document.querySelector('#fit').onclick=()=>{state.zoom=.8;state.pan={x:20,y:60};transform()};
document.querySelector('#add').onclick=()=>{if(state.nodes.length>=40)return toast('40-node prototype limit reached');const i=state.nodes.length+1;state.nodes.push({id:`task-${i}`,title:`Untitled task ${i}`,x:80+(i%4)*220,y:320+Math.floor(i/4)*110,run:'not run',artifact:'none',version:'v1',content:'No instructions yet.',status:''});render()};
search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll('[data-node]').forEach(el=>el.classList.toggle('hidden',!node(el.dataset.node).title.toLowerCase().includes(q)))};
render();
</script>
</body>
</html>
